<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--fg:#1d1d1b;--muted:#6b6b66;--line:#e2e2dc;--accent:#2e7d32;--sel:#e8f3e8;--ref:rgba(46,125,50,.15)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--panel:#1e1e1c;--fg:#ecece8;--muted:#9a9a93;--line:#33332f;--accent:#66bb6a;--sel:#243324;--ref:rgba(102,187,106,.18)}}
:root[data-theme="dark"]{--bg:#141413;--panel:#1e1e1c;--fg:#ecece8;--muted:#9a9a93;--line:#33332f;--accent:#66bb6a;--sel:#243324;--ref:rgba(102,187,106,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:grid;grid-template-columns:260px 1fr}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside header{padding:12px;border-bottom:1px solid var(--line)}
aside h1{font-size:15px;margin:0 0 8px}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#q{width:100%;margin-bottom:6px}#f{width:100%}
#list{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
#list li{padding:6px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
#list li.on{background:var(--sel);font-weight:600}
#list li .lab{color:var(--muted)}
main{display:grid;grid-template-rows:auto 1fr;min-height:0;overflow:auto}
.top{display:flex;gap:12px;padding:12px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--line);background:var(--panel)}
.top .meta{flex:1;min-width:240px}
.pid{font-size:16px;font-weight:600}
.muted{color:var(--muted);font-size:12.5px}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.labels button{cursor:pointer;padding:3px 8px;font-size:12.5px}
.labels button:hover{border-color:var(--accent)}
#conf button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#copied{color:var(--accent);font-size:12.5px;min-height:1.2em}
.grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.4fr);gap:12px;padding:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:0}
.card h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
#map{height:420px;border-radius:6px}
.charts{display:grid;gap:12px}
.chartbox{position:relative;height:200px}
a{color:var(--accent)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
@media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:40vh 1fr}.grid{grid-template-columns:1fr}#map{height:300px}}
</style>
</head>
<body>
<aside>
  <header>
    <h1>__TITLE__</h1>
    <input id="q" placeholder="搜索点号">
    <select id="f"><option value="">全部预填标签</option></select>
    <div class="muted" style="margin-top:6px"><kbd>↑</kbd><kbd>↓</kbd> 切换点</div>
  </header>
  <ul id="list"></ul>
</aside>
<main>
  <div class="top">
    <div class="meta">
      <div class="pid" id="pid"></div>
      <div class="muted" id="info"></div>
      <div class="muted" id="desc"></div>
      <div style="margin-top:6px"><a id="ge" target="_blank" rel="noopener">在 Google Earth 网页版打开 ↗</a></div>
    </div>
    <div>
      <div class="muted">点击标签 → 复制「点号|标签|置信度」，粘贴到 Google Earth 地标名称</div>
      <div class="labels" id="conf"><span class="muted" style="align-self:center">置信度</span></div>
      <div class="labels" id="labs"></div>
      <div id="copied"></div>
    </div>
  </div>
  <div class="grid">
    <div class="card"><h2>底图（Esri 当前影像，非 2021；2021 年请用 Google Earth 历史影像核对）· 方框 = 10 m 像元</h2><div id="map"></div></div>
    <div class="charts">
      <div class="card"><h2 id="t2"></h2><div class="chartbox"><canvas id="c2"></canvas></div></div>
      <div class="card"><h2 id="t1"></h2><div class="chartbox"><canvas id="c1"></canvas></div></div>
    </div>
  </div>
</main>
<script>
const KIT = __KIT__;           // [{point_id, lon, lat, label, source, desc}]
const TS = __TS__;             // {year, points:{pid:{s2:[[doy,v]], s1:[[doy,v,orb]]}}}
const LABELS = __LABELS__;
const YEAR = TS.year;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const median = a => { const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length? (s.length%2? s[m] : (s[m-1]+s[m])/2) : null; };

// 16 天窗口中位数平滑
function smooth(obs, step=16){
  const out=[]; for(let d=1; d<=366; d+=step){
    const v=obs.filter(o=>o[0]>=d-step && o[0]<d+step).map(o=>o[1]);
    if(v.length) out.push({x:d, y:median(v)});
  } return out;
}
// 参考：预填标签为 tea 的点（旧标签，未核验）的中位数曲线
const teaIds = KIT.filter(k=>k.label==="tea").map(k=>k.point_id);
function refCurve(key){
  const all = teaIds.flatMap(id => (TS.points[id]||{})[key]||[]);
  return smooth(all);
}
const REF2 = refCurve("s2"), REF1 = refCurve("s1");

// 每月 1 日对应的年积日
const MONTH_DOY = Array.from({length:12},(_,m)=>Math.round((new Date(YEAR,m,1)-new Date(YEAR,0,1))/864e5)+1);
const monthTicks = {callback:v=>{const m=MONTH_DOY.indexOf(v);return m>=0?(m+1)+"月":""}, maxRotation:0, autoSkip:false};
function mkChart(el, ymin, ymax, ylab){
  return new Chart(el, {type:"scatter", data:{datasets:[]}, options:{
    animation:false, maintainAspectRatio:false,
    scales:{x:{min:1,max:366,ticks:monthTicks,afterBuildTicks:a=>{a.ticks=MONTH_DOY.map(v=>({value:v}))},grid:{color:css("--line")}},y:{min:ymin,max:ymax,title:{display:true,text:ylab},grid:{color:css("--line")}}},
    plugins:{legend:{labels:{boxWidth:10,color:css("--fg")}}, tooltip:{callbacks:{label:c=>{const d=new Date(YEAR,0,c.raw.x);return `${d.getMonth()+1}/${d.getDate()}: ${c.raw.y.toFixed(3)}`}}}}
  }});
}
const c2 = mkChart(document.getElementById("c2"), -0.1, 1, "NDVI");
const c1 = mkChart(document.getElementById("c1"), -28, -8, "VH (dB)");

// 地图
const map = L.map("map",{zoomControl:true}).setView([30,118],15);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"}).addTo(map);
let marker, box;

// 列表
const list = document.getElementById("list"), q = document.getElementById("q"), f = document.getElementById("f");
[...new Set(KIT.map(k=>k.label))].sort().forEach(l=>f.add(new Option(l,l)));
let view = KIT, cur = 0;
function renderList(){
  const s=q.value.trim().toLowerCase(), lf=f.value;
  view = KIT.filter(k=>(!s||k.point_id.toLowerCase().includes(s)) && (!lf||k.label===lf));
  list.innerHTML = view.map((k,i)=>`<li data-i="${i}"><span>${k.point_id}</span><span class="lab">${k.label}</span></li>`).join("");
  if(view.length) show(0);
}
list.onclick = e => { const li=e.target.closest("li"); if(li) show(+li.dataset.i); };
q.oninput = renderList; f.onchange = renderList;
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowDown"){show(Math.min(cur+1,view.length-1));e.preventDefault()}
  if(e.key==="ArrowUp"){show(Math.max(cur-1,0));e.preventDefault()}
});

// 标签与置信度
let conf = "3";
const confBox = document.getElementById("conf");
["1","2","3"].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.onclick=()=>{conf=c;[...confBox.querySelectorAll("button")].forEach(x=>x.classList.toggle("on",x===b))};if(c===conf)b.classList.add("on");confBox.appendChild(b)});
const labs = document.getElementById("labs");
LABELS.forEach(l=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>copyName(l);labs.appendChild(b)});
async function copyName(l){
  const k=view[cur], s=`${k.point_id}|${l}|${conf}`;
  try{ await navigator.clipboard.writeText(s); document.getElementById("copied").textContent="已复制："+s; }
  catch{ document.getElementById("copied").textContent="复制失败，请手动输入："+s; }
}

function show(i){
  cur=i; const k=view[i]; if(!k) return;
  [...list.children].forEach((li,j)=>li.classList.toggle("on",j===i));
  list.children[i]?.scrollIntoView({block:"nearest"});
  document.getElementById("pid").textContent = k.point_id;
  document.getElementById("info").textContent = `预填：${k.label} · 来源：${k.source} · ${k.lat.toFixed(5)}, ${k.lon.toFixed(5)}`;
  document.getElementById("desc").textContent = k.desc||"";
  document.getElementById("ge").href = `https://earth.google.com/web/@${k.lat},${k.lon},150a,500d,35y,0h,0t,0r`;
  document.getElementById("copied").textContent="";

  map.setView([k.lat,k.lon],17);
  marker && marker.remove(); box && box.remove();
  marker = L.circleMarker([k.lat,k.lon],{radius:3,color:"#ff1744",fillOpacity:1}).addTo(map);
  const dLat=5/111320, dLon=5/(111320*Math.cos(k.lat*Math.PI/180));
  box = L.rectangle([[k.lat-dLat,k.lon-dLon],[k.lat+dLat,k.lon+dLon]],{color:"#ffea00",weight:2,fill:false}).addTo(map);

  const p = TS.points[k.point_id]||{s2:[],s1:[]};
  const acc=css("--accent"), ref=css("--ref"), mut=css("--muted");
  c2.data.datasets=[
    {label:"旧标签茶园中位数（参考，未核验）",data:REF2,showLine:true,pointRadius:0,borderColor:ref,backgroundColor:ref,borderWidth:6},
    {label:"本点观测",data:p.s2.map(o=>({x:o[0],y:o[1]})),pointRadius:3,backgroundColor:mut},
    {label:"本点 16 天中位数",data:smooth(p.s2),showLine:true,pointRadius:0,borderColor:acc,borderWidth:2},
  ];
  document.getElementById("t2").textContent=`Sentinel-2 NDVI ${YEAR}（去云后 ${p.s2.length} 次观测）`;
  c2.update();
  const A=p.s1.filter(o=>o[2]==="A"), D=p.s1.filter(o=>o[2]==="D");
  c1.data.datasets=[
    {label:"旧标签茶园中位数（参考）",data:REF1,showLine:true,pointRadius:0,borderColor:ref,borderWidth:6},
    {label:`升轨 (${A.length})`,data:A.map(o=>({x:o[0],y:o[1]})),pointRadius:2.5,backgroundColor:"#1e88e5"},
    {label:`降轨 (${D.length})`,data:D.map(o=>({x:o[0],y:o[1]})),pointRadius:2.5,backgroundColor:"#fb8c00"},
    {label:"16 天中位数",data:smooth(p.s1),showLine:true,pointRadius:0,borderColor:acc,borderWidth:2},
  ];
  document.getElementById("t1").textContent=`Sentinel-1 VH ${YEAR}（${p.s1.length} 次观测）`;
  c1.update();
}
renderList();
</script>
</body>
</html>
