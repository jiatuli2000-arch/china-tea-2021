<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f7f7f5;--panel:#fff;--fg:#1d1d1b;--muted:#6b6b66;--line:#e2e2dc;--accent:#2e7d32;--sel:#e8f3e8;--ref:rgba(46,125,50,.15)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--panel:#1e1e1c;--fg:#ecece8;--muted:#9a9a93;--line:#33332f;--accent:#66bb6a;--sel:#243324;--ref:rgba(102,187,106,.18)}}
:root[data-theme="dark"]{--bg:#141413;--panel:#1e1e1c;--fg:#ecece8;--muted:#9a9a93;--line:#33332f;--accent:#66bb6a;--sel:#243324;--ref:rgba(102,187,106,.18)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;height:100vh;display:grid;grid-template-columns:260px 1fr}
aside{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
aside header{padding:12px;border-bottom:1px solid var(--line)}
aside h1{font-size:15px;margin:0 0 8px}
input,select,button{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#q{width:100%;margin-bottom:6px}#f{width:100%}
#list{overflow:auto;flex:1;margin:0;padding:0;list-style:none}
#list li{padding:6px 12px;cursor:pointer;border-bottom:1px solid var(--line);font-size:12.5px;display:flex;justify-content:space-between;gap:6px}
#list li.on{background:var(--sel);font-weight:600}
#list li .lab{color:var(--muted)}
main{display:grid;grid-template-rows:auto 1fr;min-height:0;overflow:auto}
.top{display:flex;gap:12px;padding:12px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid var(--line);background:var(--panel)}
.top .meta{flex:1;min-width:240px}
.pid{font-size:16px;font-weight:600}
.muted{color:var(--muted);font-size:12.5px}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.labels button{cursor:pointer;padding:3px 8px;font-size:12.5px}
.labels button:hover{border-color:var(--accent)}
#conf button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#copied{color:var(--accent);font-size:12.5px;min-height:1.2em}
.grid{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1.4fr);gap:12px;padding:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:0}
.card h2{font-size:13px;margin:0 0 6px;color:var(--muted);font-weight:600}
#map{height:420px;border-radius:6px}
.charts{display:grid;gap:12px}
.chartbox{position:relative;height:200px}
a{color:var(--accent)}
#list li .lab.done{color:var(--accent);font-weight:600}
.labels button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.labels button .k{font-family:ui-monospace,Menlo,monospace;font-size:11px;opacity:.65;margin-left:4px}
.labels.common button{font-size:13.5px;padding:5px 11px;font-weight:600}
.labels button.unusable{border-style:dashed}
#more{margin-top:4px}#more summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.row input{width:110px}#note{width:220px}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.bar button{cursor:pointer;font-size:12.5px}
#prog{font-size:12.5px;margin-top:6px}
.warn{color:#e65100;font-size:12px}
#mv.on{background:#e65100;color:#fff;border-color:#e65100}
.charts.stale .chartbox{opacity:.3}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:11px}
@media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:40vh 1fr}.grid{grid-template-columns:1fr}#map{height:300px}}
</style>
</head>
<body>
<aside>
  <header>
    <h1>__TITLE__</h1>
    <input id="q" placeholder="搜索点号">
    <select id="f"><option value="">全部预填标签</option></select>
    <select id="st" style="width:100%;margin-top:6px"><option value="">全部状态</option><option value="todo">未标注</option><option value="done">已标注</option></select>
    <div id="prog"></div>
    <div class="bar"><button id="exp">导出 CSV</button><button id="impb">导入 CSV</button><input type="file" id="imp" accept=".csv" hidden></div>
    <div class="warn">标注暂存在本浏览器里，请经常导出备份；清除浏览器数据会丢失。</div>
  </header>
  <ul id="list"></ul>
</aside>
<main>
  <div class="top">
    <div class="meta">
      <div class="pid" id="pid"></div>
      <div class="muted" id="info"></div>
      <div class="muted" id="desc"></div>
      <div style="margin-top:6px"><a id="ge" target="_blank" rel="noopener">在 Google Earth 网页版打开 ↗</a></div>
      <div class="row"><button id="mv" title="点了之后在地图上点一下新位置；Esc 取消">移动到纯净像元 <kbd>G</kbd></button><button id="mvr" hidden>恢复原位</button></div>
      <div class="warn" id="mvinfo"></div>
    </div>
    <div>
      <div class="muted">快捷键：字母选标签，<kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 置信度，<kbd>G</kbd> 移动点，<kbd>Enter</kbd> 下一个，<kbd>↑</kbd><kbd>↓</kbd> 切换</div>
      <div class="labels" id="conf"><span class="muted" style="align-self:center">置信度</span></div>
      <div class="labels common" id="labs"></div>
      <details id="more"><summary>更多类别</summary><div class="labels" id="labs2"></div></details>
      <div class="row"><span class="muted">核对影像日期</span><input id="img" placeholder="2021-03"><span class="muted">备注</span><input id="note"></div>
      <div id="copied"></div>
    </div>
  </div>
  <div class="grid">
    <div class="card"><h2>底图（Esri 当前影像，非 2021；2021 年请用 Google Earth 历史影像核对）· 方框 = 10 m 像元</h2><div id="map"></div></div>
    <div class="charts" id="charts">
      <div class="card"><h2 id="t2"></h2><div class="chartbox"><canvas id="c2"></canvas></div></div>
      <div class="card"><h2 id="t1"></h2><div class="chartbox"><canvas id="c1"></canvas></div></div>
    </div>
  </div>
</main>
<script>
const KIT = __KIT__;           // [{point_id, lon, lat, label, source, desc}]
const TS = __TS__;             // {year, points:{pid:{s2:[[doy,v]], s1:[[doy,v,orb]]}}}
const LABELS = __LABELS__;
const YEAR = TS.year;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const median = a => { const s=[...a].sort((x,y)=>x-y), m=s.length>>1; return s.length? (s.length%2? s[m] : (s[m-1]+s[m])/2) : null; };

// 16 天窗口中位数平滑
function smooth(obs, step=16){
  const out=[]; for(let d=1; d<=366; d+=step){
    const v=obs.filter(o=>o[0]>=d-step && o[0]<d+step).map(o=>o[1]);
    if(v.length) out.push({x:d, y:median(v)});
  } return out;
}
// 参考：预填标签为 tea 的点（旧标签，未核验）的中位数曲线
const teaIds = KIT.filter(k=>k.label==="tea").map(k=>k.point_id);
function refCurve(key){
  const all = teaIds.flatMap(id => (TS.points[id]||{})[key]||[]);
  return smooth(all);
}
const REF2 = refCurve("s2"), REF1 = refCurve("s1");

// 每月 1 日对应的年积日
const MONTH_DOY = Array.from({length:12},(_,m)=>Math.round((new Date(YEAR,m,1)-new Date(YEAR,0,1))/864e5)+1);
const monthTicks = {callback:v=>{const m=MONTH_DOY.indexOf(v);return m>=0?(m+1)+"月":""}, maxRotation:0, autoSkip:false};
function mkChart(el, ymin, ymax, ylab){
  return new Chart(el, {type:"scatter", data:{datasets:[]}, options:{
    animation:false, maintainAspectRatio:false,
    scales:{x:{min:1,max:366,ticks:monthTicks,afterBuildTicks:a=>{a.ticks=MONTH_DOY.map(v=>({value:v}))},grid:{color:css("--line")}},y:{min:ymin,max:ymax,title:{display:true,text:ylab},grid:{color:css("--line")}}},
    plugins:{legend:{labels:{boxWidth:10,color:css("--fg")}}, tooltip:{callbacks:{label:c=>{const d=new Date(YEAR,0,c.raw.x);return `${d.getMonth()+1}/${d.getDate()}: ${c.raw.y.toFixed(3)}`}}}}
  }});
}
const c2 = mkChart(document.getElementById("c2"), -0.1, 1, "NDVI");
const c1 = mkChart(document.getElementById("c1"), -28, -8, "VH (dB)");

// 地图
const map = L.map("map",{zoomControl:true}).setView([30,118],15);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Esri"}).addTo(map);
let marker, box, origin, link;

// 列表
const list = document.getElementById("list"), q = document.getElementById("q"), f = document.getElementById("f");
[...new Set(KIT.map(k=>k.label))].sort().forEach(l=>f.add(new Option(l,l)));
let view = KIT, cur = 0;
function renderList(){
  const s=q.value.trim().toLowerCase(), lf=f.value;
  const st=document.getElementById("st").value;
  view = KIT.filter(k=>(!s||k.point_id.toLowerCase().includes(s)) && (!lf||k.label===lf)
    && (!st || (st==="done") === !!ANN[k.point_id]?.label));
  list.innerHTML = view.map((k,i)=>{const r=ANN[k.point_id];
    return `<li data-i="${i}"><span>${k.point_id}</span><span class="lab${r?.label?" done":""}">${r?.label?(NAME[r.label]||r.label):k.label}</span></li>`}).join("");
  updateProg();
  if(view.length) show(0);
}
list.onclick = e => { const li=e.target.closest("li"); if(li) show(+li.dataset.i); };
q.oninput = renderList; f.onchange = renderList; document.getElementById("st").onchange = renderList;
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key==="ArrowDown"){show(Math.min(cur+1,view.length-1));e.preventDefault()}
  if(e.key==="ArrowUp"){show(Math.max(cur-1,0));e.preventDefault()}
});

// ---------- 标注状态（localStorage） ----------
const KEY = "tea-probe:" + document.title;
let ANN = {};
try { ANN = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(ANN)); } catch {} updateProg(); };
let lastImg = (() => { try { return localStorage.getItem(KEY+":img") || ""; } catch { return ""; } })();

const HOTKEY = Object.fromEntries(LABELS.map(l=>[l.key,l.code]));
const NAME = Object.fromEntries(LABELS.map(l=>[l.code,l.name]));
const UNUSABLE = new Set(["mixed","other","ancient_tea","shaded_tea"]);

const confBox = document.getElementById("conf"), labs = document.getElementById("labs");
const imgIn = document.getElementById("img"), noteIn = document.getElementById("note");
["1","2","3"].forEach(c=>{const b=document.createElement("button");b.textContent=c;b.dataset.c=c;b.onclick=()=>setConf(c);confBox.appendChild(b)});
LABELS.forEach(l=>{const b=document.createElement("button");b.innerHTML=`${l.name}<span class="k">${l.key}</span>`;b.title=l.code;b.dataset.l=l.code;
  if(UNUSABLE.has(l.code)) b.classList.add("unusable");
  b.onclick=()=>setLabel(l.code);(l.tier==="common"?labs:document.getElementById("labs2")).appendChild(b)});
const allLabBtns = ()=>[...document.querySelectorAll("#labs button,#labs2 button")];

function curId(){ return view[cur]?.point_id; }
function rec(){ const id=curId(); return ANN[id] || (ANN[id]={}); }
function touch(r){ r.t=new Date().toISOString(); if(!r.img) r.img = imgIn.value.trim() || lastImg; if(!r.conf) r.conf="3"; }
function setLabel(l){ const r=rec(); r.label=l; touch(r); save(); paint(); refreshRow(); }
function setConf(c){ const r=rec(); r.conf=c; save(); paint(); }
imgIn.onchange = ()=>{ const v=imgIn.value.trim(); rec().img=v; lastImg=v; try{localStorage.setItem(KEY+":img",v)}catch{} save(); };
noteIn.onchange = ()=>{ rec().note=noteIn.value; save(); };

function paint(){
  const r = ANN[curId()] || {};
  allLabBtns().forEach(b=>b.classList.toggle("on", b.dataset.l===r.label));
  [...confBox.querySelectorAll("button")].forEach(b=>b.classList.toggle("on", b.dataset.c===(r.conf||"3")));
  imgIn.value = r.img || lastImg; noteIn.value = r.note || "";
  document.getElementById("copied").textContent = r.label ? `已标注：${NAME[r.label]||r.label} · 置信度 ${r.conf} · ${r.img||"缺影像日期"}` : "未标注";
}
function refreshRow(){
  const li=list.children[cur], r=ANN[curId()];
  if(li && r?.label){ const s=li.querySelector(".lab"); s.textContent=NAME[r.label]||r.label; s.classList.add("done"); }
}
function updateProg(){
  const n = KIT.filter(k=>ANN[k.point_id]?.label).length;
  const noimg = KIT.filter(k=>ANN[k.point_id]?.label && !ANN[k.point_id]?.img).length;
  document.getElementById("prog").innerHTML = `进度：${n} / ${KIT.length}` + (noimg?` · <span style="color:#e65100">缺影像日期 ${noimg}</span>`:"");
}

document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT" || e.metaKey || e.ctrlKey) return;
  const k=e.key.toLowerCase();
  if(HOTKEY[k]){ setLabel(HOTKEY[k]); e.preventDefault(); }
  else if(["1","2","3"].includes(k)){ setConf(k); e.preventDefault(); }
  else if(k==="g"){ setMove(!moveMode); e.preventDefault(); }
  else if(k==="escape"){ setMove(false); }
  else if(k==="enter"){ show(Math.min(cur+1,view.length-1)); e.preventDefault(); }
});

// ---------- 导出 / 导入 ----------
const esc = v => { v = (v ?? "").toString(); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
document.getElementById("exp").onclick = ()=>{
  const head=["point_id","lon","lat","label","confidence","imagery_date","note","prefill","source","labeled_at","orig_lon","orig_lat","moved_m"];
  const rows=KIT.filter(k=>ANN[k.point_id]?.label).map(k=>{const r=ANN[k.point_id], [la,lo]=pos(k), m=movedM(k);
    return [k.point_id,lo,la,r.label,r.conf||"",r.img||"",r.note||"",k.label,k.source,r.t||"",k.lon,k.lat,m?m.toFixed(1):""].map(esc).join(",");});
  const blob=new Blob(["﻿"+head.join(",")+"\n"+rows.join("\n")+"\n"],{type:"text/csv"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`${document.title.split(" ")[0]}_labels_${new Date().toISOString().slice(0,16).replace(/[:T]/g,"")}.csv`; a.click();
};
document.getElementById("impb").onclick = ()=>document.getElementById("imp").click();
document.getElementById("imp").onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  const lines=(await f.text()).replace(/^﻿/,"").trim().split(/\r?\n/);
  const H=lines.shift().split(","); const ix=n=>H.indexOf(n);
  let n=0;
  for(const line of lines){
    const c=line.match(/("([^"]|"")*"|[^,]*)(,|$)/g).map(x=>x.replace(/,$/,"").replace(/^"|"$/g,"").replace(/""/g,'"'));
    const id=c[ix("point_id")]; if(!id) continue;
    ANN[id]={label:c[ix("label")],conf:c[ix("confidence")],img:c[ix("imagery_date")],note:c[ix("note")],t:c[ix("labeled_at")]};
    if(ix("moved_m")>=0 && c[ix("moved_m")]){ ANN[id].lat=+c[ix("lat")]; ANN[id].lon=+c[ix("lon")]; }
    n++;
  }
  save(); renderList(); alert(`已导入 ${n} 条标注`);
};

function show(i){
  cur=i; const k=view[i]; if(!k) return;
  [...list.children].forEach((li,j)=>li.classList.toggle("on",j===i));
  list.children[i]?.scrollIntoView({block:"nearest"});
  document.getElementById("pid").textContent = k.point_id;
  document.getElementById("info").textContent = `预填：${k.label} · 来源：${k.source} · ${k.lat.toFixed(5)}, ${k.lon.toFixed(5)}`;
  document.getElementById("desc").textContent = k.desc||"";
  setMove(false); paint();
  map.setView(pos(k),17);
  drawPoint(k);

  const p = TS.points[k.point_id]||{s2:[],s1:[]};
  const acc=css("--accent"), ref=css("--ref"), mut=css("--muted");
  c2.data.datasets=[
    ...(REF2.length?[{label:"预填为茶树的点中位数（参考，未核验）",data:REF2,showLine:true,pointRadius:0,borderColor:ref,backgroundColor:ref,borderWidth:6}]:[]),
    {label:"本点观测",data:p.s2.map(o=>({x:o[0],y:o[1]})),pointRadius:3,backgroundColor:mut},
    {label:"本点 16 天中位数",data:smooth(p.s2),showLine:true,pointRadius:0,borderColor:acc,borderWidth:2},
  ];
  document.getElementById("t2").textContent=`Sentinel-2 NDVI ${YEAR}（去云后 ${p.s2.length} 次观测）`;
  c2.update();
  const A=p.s1.filter(o=>o[2]==="A"), D=p.s1.filter(o=>o[2]==="D");
  c1.data.datasets=[
    ...(REF1.length?[{label:"预填为茶树的点中位数（参考）",data:REF1,showLine:true,pointRadius:0,borderColor:ref,borderWidth:6}]:[]),
    {label:`升轨 (${A.length})`,data:A.map(o=>({x:o[0],y:o[1]})),pointRadius:2.5,backgroundColor:"#1e88e5"},
    {label:`降轨 (${D.length})`,data:D.map(o=>({x:o[0],y:o[1]})),pointRadius:2.5,backgroundColor:"#fb8c00"},
    {label:"16 天中位数",data:smooth(p.s1),showLine:true,pointRadius:0,borderColor:acc,borderWidth:2},
  ];
  document.getElementById("t1").textContent=`Sentinel-1 VH ${YEAR}（${p.s1.length} 次观测）`;
  c1.update();
}
// ---------- 移动点：混合像元 → 附近纯净像元 ----------
// 移动后坐标存在 ANN[id].lat/lon；曲线仍是原位置的，导出后用 review_moved.py 按新位置重新提取复核
const MOVE_WARN_M = 100;
let moveMode = false;
const mvBtn = document.getElementById("mv"), mvr = document.getElementById("mvr");
function pos(k){ const r=ANN[k.point_id]; return r && r.lat!=null ? [r.lat,r.lon] : [k.lat,k.lon]; }
function distM([la1,lo1],[la2,lo2]){ const x=(lo2-lo1)*Math.PI/180*Math.cos((la1+la2)/2*Math.PI/180), y=(la2-la1)*Math.PI/180; return 6371000*Math.hypot(x,y); }
function movedM(k){ const r=ANN[k.point_id]; return r && r.lat!=null ? distM([k.lat,k.lon],[r.lat,r.lon]) : 0; }
function setMove(on){ moveMode=on; mvBtn.classList.toggle("on",on); map.getContainer().style.cursor=on?"crosshair":""; }
mvBtn.onclick = ()=>setMove(!moveMode);
map.on("click", e=>{
  if(!moveMode) return;
  const r=rec(); r.lat=+e.latlng.lat.toFixed(6); r.lon=+e.latlng.lng.toFixed(6);
  save(); setMove(false); drawPoint(view[cur]);
});
mvr.onclick = ()=>{ const r=rec(); delete r.lat; delete r.lon; save(); drawPoint(view[cur]); };
function drawPoint(k){
  [marker,box,origin,link].forEach(x=>x&&x.remove()); origin=link=null;
  const p=pos(k), m=movedM(k);
  if(m){
    origin = L.circleMarker([k.lat,k.lon],{radius:4,color:"#9e9e9e",weight:2,fillOpacity:0}).addTo(map);
    link = L.polyline([[k.lat,k.lon],p],{color:"#9e9e9e",weight:1,dashArray:"4 4"}).addTo(map);
  }
  marker = L.circleMarker(p,{radius:3,color:"#ff1744",fillOpacity:1}).addTo(map);
  const dLat=5/111320, dLon=5/(111320*Math.cos(p[0]*Math.PI/180));
  box = L.rectangle([[p[0]-dLat,p[1]-dLon],[p[0]+dLat,p[1]+dLon]],{color:"#ffea00",weight:2,fill:false}).addTo(map);
  document.getElementById("ge").href = `https://earth.google.com/web/@${p[0]},${p[1]},150a,500d,35y,0h,0t,0r`;
  mvr.hidden = !m;
  document.getElementById("charts").classList.toggle("stale", !!m);
  document.getElementById("mvinfo").textContent = m
    ? `已从原位置（灰圈）移动 ${m.toFixed(0)} m。右侧曲线仍是原位置的，仅作参考；导出后会按新位置重新提取曲线再复核。`
      + (m>MOVE_WARN_M ? ` 移动超过 ${MOVE_WARN_M} m，已经不算同一个点，建议只在相邻几个像元内挪。` : "")
    : "";
}
renderList();
</script>
</body>
</html>
